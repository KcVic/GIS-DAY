<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Enter your map title -->
  <title>My First Web Map | GIS Day</title>
  <link rel="icon" href="asset/media/gis-achievers-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="asset/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="asset/media/gis-achievers-logo.jpg" alt="GIS Achievers Foundation logo">
      <div>
        <p>GIS Day</p>
        <!-- Enter your map title -->
        <h1>My First Web Map</h1>
        <!-- Enter a short description of your map -->
        <p class="tagline">A short sentence about what this map shows.</p>
      </div>
    </div>
    <span class="badge"><span class="dot"></span>Interactive map</span>

  <main>
    <div class="map">
      <!-- Paste your Ezymaps embed code here -->
    </div>

  <footer>
    <!-- Enter your name -->
    <p class="built-by">Built by <span>Your Name</span></p>
    <p class="about">This map was built as part of the GIS Day training webinar organised by <strong>GIS Achievers Foundation</strong>.</p>
